name: Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run unit tests
        run: .\gradlew.bat testDebugUnitTest --no-daemon

      - name: Build Android test APK
        run: .\gradlew.bat assembleDebugAndroidTest --no-daemon
